<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Compose New Email</title>
  <link rel="stylesheet" href="compose-v3.css">
</head>
<body>

<div class="container">

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <span class="back">←</span>
      <h2>Compose New Email</h2>
    </div>

    <div class="header-right">
      <span class="icon">📎</span>
      <span class="icon">🕒</span>
      <button class="send-later">Send Later</button>
    </div>
  </header>

  <!-- FORM -->
  <div class="form">

    <!-- FROM -->
    <div class="row">
      <label>From</label>
      <select>
        <option>oliver.brown@domain.io</option>
      </select>
    </div>

    <!-- TO -->
    <div class="row">
      <label>To</label>
      <div class="to-field">
        <span class="chip">tame@gmail.com</span>
        <span class="chip">lame@gmail.com</span>
        <span class="chip">dame@gmail.com</span>
        <span class="chip more">+4</span>
      </div>
      <span class="upload">⬆ Upload List</span>
    </div>

    <!-- SUBJECT -->
    <div class="row">
      <label>Subject</label>
      <input type="text" placeholder="Subject">
    </div>

    <!-- DELAY -->
    <div class="row inline">
      <div>
        <label>Delay between 2 emails</label>
        <input type="number" value="00">
      </div>
      <div>
        <label>Hourly Limit</label>
        <input type="number" value="00">
      </div>
    </div>

    <!-- EDITOR -->
    <div class="editor">
      <div class="editor-placeholder">Type Your Reply...</div>

      <div class="toolbar">
        <span>↶</span>
        <span>↷</span>
        <span>Tt</span>
        <span><b>B</b></span>
        <span><i>I</i></span>
        <span><u>U</u></span>
        <span>≡</span>
        <span>1.</span>
        <span>•</span>
        <span>❝</span>
        <span>🔗</span>
        <span>S</span>
      </div>
    </div>

  </div>
</div>

</body>
</html>
